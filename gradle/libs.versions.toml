[versions]
android-compile-sdk = "36"
android-min-sdk = "26"
android-target-sdk = "36"
agp = "9.3.1"
# HELD at 2.3.10 (was briefly 2.4.10). Kotlin 2.4 emits metadata version 2.4.0, and Hilt
# — up to and including 2.60.1 — still bundles kotlin-metadata-jvm 2.3.x, whose ceiling is
# 2.3.0. Any Hilt consumer of `bindjs-android` then fails annotation processing with
# "Provided Metadata instance has version 2.4.0, while maximum supported version is 2.3.0"
# (samples/assistant-demo in metabind-android is one). Raise this once Hilt ships a
# 2.4-capable metadata library, and keep the buildscript classpath in build.gradle.kts
# in step.
kotlin = "2.3.10"
# core-ktx 1.19.0+ requires consumers to compile against API 37. Raising `compileSdk`
# here propagates that floor to everything that depends on `ai.metabind:bindjs-android`,
# so it stays on the last 1.18.x until that bump is made deliberately.
coreKtx = "1.18.0"
javascriptengine = "1.1.0"
gson = "2.14.0"
junit = "4.13.2"
coil = "2.7.0"
media3-exoplayer = "1.10.1"
markwon = "4.6.2"
# commonmark moved groupId at 0.14 (com.atlassian.commonmark -> org.commonmark) keeping its
# package names, so the two coordinates are the same classes twice and any app that dexes
# both fails. Markwon 4.6.2 still asks for the old ones, so bindjs pins the new ones itself
# and excludes the old group from Markwon (see bindjs/build.gradle.kts). 0.21 is the ceiling
# Markwon's API survives: 0.22 renames BulletList.getBulletMarker to getMarker.
commonmark = "0.21.0"
robolectric = "4.17"
roborazzi = "1.74.0"
androidx-test-ext-junit = "1.3.0"
# SceneView 3.0.0 reshaped the `Scene` composable — `childNodes` and `onViewCreated` are
# gone, and the engine/skybox receivers and touch handling moved. Model3DView.kt has to be
# rewritten before this can advance past the 2.x line.
sceneview = "2.3.3"
android-compose = "1.11.4"
androidx-activity-compose = "1.13.0"
vico = "3.2.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
javascriptengine = { module = "androidx.javascriptengine:javascriptengine", version.ref = "javascriptengine" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
kotlin-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version = "1.11.0" }
android-compose-material = { module = "androidx.compose.material3:material3", version = "1.4.0" }
# SF Symbol names have no Android equivalent, so `systemIcon()` maps them onto Material's
# base icon set. 1.7.8 is the last release of material-icons-core — androidx stopped
# shipping it after that in favour of vendoring individual icons — and it stays compatible
# with newer Compose because it only depends on compose-ui, which resolves up to the
# version above.
android-compose-material-icons = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
android-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "android-compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3-exoplayer" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3-exoplayer" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3-exoplayer" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-ext-strikethrough = { module = "io.noties.markwon:ext-strikethrough", version.ref = "markwon" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
sceneview = { group = "io.github.sceneview", name = "arsceneview", version.ref = "sceneview" }
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "android-compose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "android-compose" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
